name: Contract and browser verification

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FEATURE_STANDARDS_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: feature_test
          POSTGRES_PASSWORD: feature_test
          POSTGRES_DB: feature_standards_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U feature_test -d feature_standards_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.4'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: implementations/go-net-http/go.sum
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: implementations/java-spring/pom.xml
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            clients/react/package-lock.json
            examples/consumer-python-react/package-lock.json
      - name: Install Python and validator dependencies
        run: |
          uv sync --frozen --project implementations/python-fastapi
          uv sync --frozen --project tools
          uv sync --frozen --project examples/consumer-python-react
      - name: Prepare isolated PostgreSQL databases and explicit demo fixtures
        run: uv run --frozen --project tools python tests/prepare_postgres.py
      - name: Validate OpenAPI and scenario coverage
        run: |
          uv run --frozen --project tools python tools/check_contract.py
          uv run --frozen --project tools python tools/check_mail_contract.py
          uv run --frozen --project tools python tools/auth_catalog.py --check
      - name: Test local process harness
        run: uv run --frozen --project tools python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test delayed registry availability and integrity checks
        run: node --test tools/verify-npm-release.test.mjs
      - name: Test account schema transactions in a dedicated database
        env:
          AUTH_ACCOUNT_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_v3_sql?sslmode=disable
        run: uv run --frozen --project tools python -m unittest discover -s tests -p test_account_store.py -v
      - name: Test SMTP delivery and capture transactions in isolated databases
        env:
          AUTH_MAIL_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_mail_worker?sslmode=disable
          AUTH_MAIL_CAPTURE_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_mail_capture?sslmode=disable
        run: |
          uv run --frozen --project tools python -m unittest discover -s tests -p test_mail_worker.py -v
          uv run --frozen --project tools python -m unittest discover -s tests -p test_mail_capture_delivery.py -v
      - name: Python tests and lint
        env:
          AUTH_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_python?sslmode=disable
          AUTH_ACCOUNT_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_v3_python?sslmode=disable
        run: |
          uv run --frozen --project implementations/python-fastapi pytest implementations/python-fastapi/tests
          uv run --frozen --project implementations/python-fastapi ruff check implementations/python-fastapi tests tools packages/create-feature-auth/src/check-db.py packages/create-feature-auth/test/check_db.py
      - name: Go tests and race detection
        env:
          AUTH_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_go?sslmode=disable
          AUTH_ACCOUNT_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_v3_go?sslmode=disable
        working-directory: implementations/go-net-http
        run: go test -race ./...
      - name: Java tests
        env:
          AUTH_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_java?sslmode=disable
          AUTH_ACCOUNT_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_v3_java?sslmode=disable
        working-directory: implementations/java-spring
        run: ./mvnw -q test
      - name: Rust tests and lint
        env:
          AUTH_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_rust?sslmode=disable
          AUTH_ACCOUNT_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_v3_rust?sslmode=disable
        working-directory: implementations/rust-axum
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked postgres_real_transactions -- --ignored
          cargo test --locked postgres_accounts_registration -- --ignored
      - name: Test Rust PostgreSQL TLS certificates and downgrade refusal
        run: python3 implementations/rust-axum/tests/postgres_tls.py
      - name: Verify independent Go Java and Rust library consumers
        run: |
          go -C examples/consumer-go test -race ./...
          implementations/java-spring/mvnw -q -f implementations/java-spring/pom.xml -DskipTests install
          implementations/java-spring/mvnw -q -f examples/consumer-java/pom.xml package
          cargo fmt --all --manifest-path examples/consumer-rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path examples/consumer-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/consumer-rust/Cargo.toml
      - name: Build standalone server distributions
        run: |
          uv build --project implementations/python-fastapi --out-dir dist/python
          uvx --from twine==7.0.0 twine check --strict dist/python/*
          cargo package --locked --manifest-path implementations/rust-axum/Cargo.toml
      - name: Verify server archives in independent consumer projects
        run: uv run --frozen --project tools python tools/check_server_distributions.py
      - name: Preserve server distributions for an authenticated GitHub release
        run: |
          mkdir "$RUNNER_TEMP/server-distributions"
          cp dist/python/*.whl dist/python/*.tar.gz "$RUNNER_TEMP/server-distributions/"
          cp implementations/rust-axum/target/package/*.crate "$RUNNER_TEMP/server-distributions/"
          cp LICENSE "$RUNNER_TEMP/server-distributions/"
          python - <<'PY'
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, 'tools')
          from release_metadata import metadata
          record = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'packages': [metadata(target) for target in ('python', 'java', 'rust')],
              'scope': 'Server archives built in source CI; public language registry publication is separate.',
          }
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'server-distributions'
          java = metadata('java')
          artifact = java['name'].split(':')[1]
          libraries = list((pathlib.Path(java['directory']) / 'target').glob('*-library.jar'))
          if len(libraries) != 1:
              raise ValueError('one plain library classifier JAR is required')
          shutil.copyfile(libraries[0], directory / f"{artifact}-{java['version']}-library.jar")
          shutil.copyfile(pathlib.Path(java['directory']) / 'pom.xml', directory / f"{artifact}-{java['version']}.pom")
          (directory / 'SOURCE.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          cd "$RUNNER_TEMP/server-distributions"
          sha256sum *.whl *.tar.gz *-library.jar *.pom *.crate LICENSE SOURCE.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-distributions
          path: ${{ runner.temp }}/server-distributions/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify a signed Maven Central bundle without uploading
        run: uv run --frozen --project tools python tools/check_maven_release.py
      - name: Install and build React client
        working-directory: clients/react
        run: |
          npm ci
          npm test
          npm run build
          npm run check:package
          npx playwright install --with-deps chromium
      - name: Identical API and browser tests for all four implementations
        run: python3 tests/conformance.py --backend all --browser
      - name: PostgreSQL API and browser tests across all implementations
        run: uv run --frozen --project tools python tests/postgres_conformance.py --browser
      - name: Account API browser and mixed-language transaction tests
        run: uv run --frozen --project tools python tests/account_conformance.py --browser
      - name: Four-language accounts through real TLS SMTP and queue races
        env:
          FEATURE_STANDARDS_TEST_DATABASE_URL: postgresql://feature_test:feature_test@127.0.0.1:5432/feature_standards_test_mail_integration?sslmode=disable
        run: uv run --frozen --project tools python tests/mail_conformance.py
      - name: Install and build Python and React consumer application
        working-directory: examples/consumer-python-react
        run: |
          npm ci
          npm run build
      - name: Consumer integration and browser tests
        run: uv run --frozen --project tools python tests/consumer_conformance.py
      - name: Independent consumers with PostgreSQL v2 v3 and real browser UI
        run: uv run --frozen --project tools python tests/consumer_profiles.py --browser
      - name: Test generated applications across all four stacks and three profiles
        working-directory: packages/create-feature-auth
        run: |
          npm ci
          npm test
          npm run check:generated
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Verify generated database fixture cleanup and sentinel preservation
        run: uv run --frozen --project tools python packages/create-feature-auth/test/check_db.py
      - name: Test and install the main feature catalog from its real tarball
        working-directory: packages/feature-standards
        run: |
          npm ci
          npm test
          npm run check:pack
          npm run check:bootstrap
      - name: Verify the installed main CLI through real generated applications
        working-directory: packages/feature-standards
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package_version=$(node -p 'require("./package.json").version')
          node ../../tests/feature_workflow.mjs --tarball "$RUNNER_TEMP/feature-standards-$package_version.tgz"
      - name: Verify checked-in workflow template matches
        run: |
          cmp .github/workflows/ci.yml ci/github-actions.yml
          cmp .github/workflows/publish-npm.yml ci/publish-npm.yml
          cmp .github/workflows/publish-python.yml ci/publish-python.yml
          cmp .github/workflows/publish-rust.yml ci/publish-rust.yml
      - name: Whitespace check
        run: git diff --check
