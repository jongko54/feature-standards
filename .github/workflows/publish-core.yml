name: Build and publish core libraries

on:
  push:
    tags: [npm-core-v*, python-core-v*, rust-core-v*]
  workflow_dispatch:
    inputs:
      publish_initial_python:
        description: Publish the reviewed Python 0.1.0 artifact from source 8aabcb5 (otherwise build only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'jongko54/feature-standards'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        target: [npm-core, python-core, rust-core, java-core]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        if: matrix.target == 'java-core'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust toolchain
        if: matrix.target == 'rust-core'
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: Build exact archives and test installed public APIs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python tools/release_metadata.py "$TARGET"
          KIND=${TARGET%-core}
          python tools/check_core_distributions.py --target "$KIND" --out-dir release
          if [ "$TARGET" = python-core ]; then
            uvx --from twine==7.0.0 twine check --strict release/python/*
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.repository == 'jongko54/feature-standards'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ startsWith(github.ref, 'refs/tags/npm-core-v') && 'npm' || startsWith(github.ref, 'refs/tags/python-core-v') && 'pypi' || 'crates-io' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify exact tag and successful full main source CI
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            npm-core-v*) TARGET=npm-core ;;
            python-core-v*) TARGET=python-core ;;
            rust-core-v*) TARGET=rust-core ;;
            *) exit 1 ;;
          esac
          python tools/release_metadata.py "$TARGET" --tag "$RELEASE_TAG" --github-output >> "$GITHUB_OUTPUT"
          node tools/verify-release-ci.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.meta.outputs.target }}
          path: release
      - name: Publish npm core with its configured trusted publisher
        if: steps.meta.outputs.target == 'npm-core'
        run: |
          npm exec --yes --package=npm@12.2.1 -- npm publish "$GITHUB_WORKSPACE/release/"*.tgz --access public --tag latest
          node tools/verify-npm-release.mjs release/*.tgz '@ugauga/feature-standards-core' '${{ steps.meta.outputs.version }}'
      - name: Publish Python core with its configured trusted publisher
        if: steps.meta.outputs.target == 'python-core'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/python
      - name: Install Rust toolchain
        if: steps.meta.outputs.target == 'rust-core'
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: Compare rebuilt Rust archive before authentication
        if: steps.meta.outputs.target == 'rust-core'
        working-directory: libraries/rust
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo package --locked --registry crates-io
          cmp "target/package/feature-standards-core-$VERSION.crate" "$GITHUB_WORKSPACE/release/feature-standards-core-$VERSION.crate"
      - name: Obtain a temporary crates.io publishing token
        id: cargo-auth
        if: steps.meta.outputs.target == 'rust-core'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish Rust core with its configured trusted publisher
        if: steps.meta.outputs.target == 'rust-core'
        working-directory: libraries/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo publish --locked --registry crates-io
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 \
            "https://static.crates.io/crates/feature-standards-core/feature-standards-core-$VERSION.crate" --output "$RUNNER_TEMP/core.crate"
          cmp "$GITHUB_WORKSPACE/release/feature-standards-core-$VERSION.crate" "$RUNNER_TEMP/core.crate"

  publish-initial-python:
    # Recovery for GitHub's suppressed push event when five initial tags were pushed together.
    # The package source and artifact run are immutable, independently CI-verified constants.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_initial_python && github.repository == 'jongko54/feature-standards'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8aabcb515f46ff229da6d4cbece6921fc17fdfab
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require exact release source, immutable tag and successful full main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE: 8aabcb515f46ff229da6d4cbece6921fc17fdfab
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(git rev-parse python-core-v0.1.0^{commit})" = "$REVIEWED_SOURCE"
          python tools/release_metadata.py python-core --tag python-core-v0.1.0
          GITHUB_SHA="$REVIEWED_SOURCE" node tools/verify-release-ci.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://api.github.com/repos/jongko54/feature-standards/actions/runs/42199662926', {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
          });
          assert(response.ok);
          const run = await response.json();
          assert.equal(run.head_sha, process.env.REVIEWED_SOURCE);
          assert.equal(run.conclusion, 'success');
          assert.equal(run.path, '.github/workflows/publish-core.yml');
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: 42199662926
          name: python-core
          path: release
      - name: Verify every archive hash against the reviewed clean-source record
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('release')
          checks = json.loads((root / 'checks-python.json').read_text())
          assert checks['sourceCommit'] == '8aabcb515f46ff229da6d4cbece6921fc17fdfab'
          assert checks['sourceDirty'] is False
          expected = {entry['filename']: entry['sha256'] for entry in checks['artifacts']}
          assert set(expected) == {'feature_standards_core-0.1.0-py3-none-any.whl', 'feature_standards_core-0.1.0.tar.gz'}
          assert {file.name for file in (root / 'python').iterdir() if file.is_file()} == set(expected)
          for filename, checksum in expected.items():
              assert hashlib.sha256((root / 'python' / filename).read_bytes()).hexdigest() == checksum
          PY
      - name: Publish only the reviewed initial Python core archives
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/python
