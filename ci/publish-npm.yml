name: Build and publish npm packages

on:
  push:
    tags:
      - feature-standards-v*
      - npm-react-auth-v*
      - npm-create-feature-auth-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'jongko54/feature-standards'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        target: [npm-standards, npm-react-auth, npm-cli]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve exact package
        id: meta
        env:
          TARGET: ${{ matrix.target }}
        run: python tools/release_metadata.py "$TARGET" --github-output >> "$GITHUB_OUTPUT"
      - name: Test and pack the reviewed artifact
        working-directory: ${{ steps.meta.outputs.directory }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm test
          if [ "$TARGET" = npm-react-auth ]; then npm run check:package; fi
          if [ "$TARGET" = npm-standards ]; then
            npm run check:pack
            npm run check:bootstrap
            mkdir "$RUNNER_TEMP/bootstrap-release"
            npm run pack:bootstrap -- --out-dir "$RUNNER_TEMP/bootstrap-release"
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          npm pack --pack-destination "$GITHUB_WORKSPACE/release"
      - name: Test delayed registry availability and integrity checks
        run: node --test tools/verify-npm-release.test.mjs
      - name: Validate the exact local tarball with the release CLI
        if: >-
          github.event_name == 'push' &&
          ((matrix.target == 'npm-standards' && startsWith(github.ref, 'refs/tags/feature-standards-v')) ||
           (matrix.target == 'npm-react-auth' && startsWith(github.ref, 'refs/tags/npm-react-auth-v')) ||
           (matrix.target == 'npm-cli' && startsWith(github.ref, 'refs/tags/npm-create-feature-auth-v')))
        run: npm exec --yes --package=npm@12.2.1 -- npm publish "$GITHUB_WORKSPACE/release/"*.tgz --dry-run --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the separate namespace bootstrap for authenticated setup
        if: matrix.target == 'npm-standards'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-standards-bootstrap
          path: ${{ runner.temp }}/bootstrap-release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.repository == 'jongko54/feature-standards'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag against metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            feature-standards-v*) TARGET=npm-standards ;;
            npm-react-auth-v*) TARGET=npm-react-auth ;;
            npm-create-feature-auth-v*) TARGET=npm-cli ;;
            *) exit 1 ;;
          esac
          python tools/release_metadata.py "$TARGET" --tag "$RELEASE_TAG" --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.meta.outputs.target }}
          path: release
      - name: Require the full CI to have passed for this source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/verify-release-ci.mjs
      - name: Publish using GitHub OIDC
        run: npm exec --yes --package=npm@12.2.1 -- npm publish "$GITHUB_WORKSPACE/release/"*.tgz --access public --tag latest
      - name: Verify registry version and artifact integrity
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: node tools/verify-npm-release.mjs release/*.tgz "$PACKAGE_NAME" "$PACKAGE_VERSION"
