[package]
name = "feature-core-generated"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false

[dependencies]
feature-standards-auth = { path = {{AUTH_PATH}} }
feature-standards-core = { path = {{CORE_PATH}} }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "io-util", "time"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
