[package]
name = "feature-standards-consumer-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false

[dependencies]
feature-standards-auth = { path = "../../implementations/rust-axum" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The consumer owns its build profile; the dependency's profile is not inherited.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
