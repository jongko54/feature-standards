[package]
name = "feature-standards-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Contract-tested session authentication for Axum"
license = "MIT"
repository = "https://github.com/jongko54/feature-standards"
homepage = "https://github.com/jongko54/feature-standards"
readme = "PACKAGE.md"
keywords = ["authentication", "session", "csrf", "axum", "postgres"]
categories = ["authentication", "web-programming::http-server"]
include = ["src/**", "tests/reuse_api.rs", "Cargo.toml", "Cargo.lock", "PACKAGE.md", "LICENSE"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
getrandom = "0.4.3"
http-body-util = "0.1.3"
mime = "0.3.17"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6.1"
sha2 = "0.11.1"
tokio-postgres = "0.7.18"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "signal", "time"] }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Keep the fixed Argon2id work factor usable with the debug binary used by the
# common harness; this changes compiler optimization, not the hashing parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
