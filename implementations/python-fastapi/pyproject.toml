[project]
name = "feature-standards-python-auth"
version = "0.2.0"
description = "Contract-tested session authentication for FastAPI"
readme = "PACKAGE.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jongko54"}]
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1.0,<26",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.urls]
Repository = "https://github.com/jongko54/feature-standards"
Documentation = "https://github.com/jongko54/feature-standards/tree/main/implementations/python-fastapi"
Issues = "https://github.com/jongko54/feature-standards/issues"

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_auth"]

[tool.hatch.build.targets.sdist]
include = ["feature_auth", "pyproject.toml", "PACKAGE.md", "LICENSE"]
